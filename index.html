<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f3ed">
    <title>スピログラフ（p5.js）</title>
    <meta name="description" content="固定円の内側を転がる円にペンを取り付けたときの軌跡。R・r・dの3つの数値を変えると、図形がその場で描き変わります。">
    <link rel="canonical" href="https://kagari-tech.github.io/p5-spirograph/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="kagari.tech">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:title" content="スピログラフ（p5.js）">
    <meta property="og:description" content="固定円の内側を転がる円にペンを取り付けたときの軌跡。R・r・dの3つの数値を変えると、図形がその場で描き変わります。">
    <meta property="og:url" content="https://kagari-tech.github.io/p5-spirograph/">
    <meta property="og:image" content="https://kagari-tech.github.io/p5-spirograph/ogp.png">
    <meta property="og:image:width" content="2400">
    <meta property="og:image:height" content="1260">
    <meta property="og:image:alt" content="R 180 / r 70 / d 100 のスピログラフ">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="index.css">
    <script defer src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"
            integrity="sha384-SomRAPLG739U4EgE9jikBcMmCGPR2HQ/7rMNU5hTKbngPGnPT38K28CUR5P0oVdI"
            crossorigin="anonymous"></script>
    <script defer src="spirograph.js"></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1 class="wordmark">Spirograph<span> / p5.js</span></h1>
        <nav class="site-links">
          <a href="https://github.com/kagari-tech/p5-spirograph" target="_blank" rel="noopener" aria-label="GitHubでソースコードを見る（新しいタブで開く）">
            <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.544.0/icons/github.svg" alt="" width="14" height="14" loading="lazy" decoding="async">GitHub
          </a>
          <a href="https://kagari.tech" target="_blank" rel="noopener" aria-label="kagari.techのサイトを開く（新しいタブで開く）">
            <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.544.0/icons/globe.svg" alt="" width="14" height="14" loading="lazy" decoding="async">kagari.tech
          </a>
        </nav>
      </header>

      <div class="workspace">
        <section class="controls" aria-label="パラメータ">
          <p class="intro">固定円の内側で、もうひとつの円を転がす。その円に取り付けたペンの軌跡が、図形になります。3つの数値を変えると、図形はその場で描き変わります。</p>

          <form id="parameters">
            <div class="parameter">
              <div class="parameter-heading">
                <label for="R">固定円の半径 <span>R</span></label>
                <input id="R" name="R" type="number" min="2" max="300" step="1" value="180" required aria-describedby="R-help input-error">
              </div>
              <input id="R-range" data-parameter="R" type="range" min="2" max="300" step="1" value="180" aria-label="固定円の半径 R のスライダー">
              <p id="R-help" class="hint">外側の、動かない円の大きさ</p>
            </div>

            <div class="parameter">
              <div class="parameter-heading">
                <label for="r">回転円の半径 <span>r</span></label>
                <input id="r" name="r" type="number" min="1" max="179" step="1" value="70" required aria-describedby="r-help input-error">
              </div>
              <input id="r-range" data-parameter="r" type="range" min="1" max="179" step="1" value="70" aria-label="回転円の半径 r のスライダー">
              <p id="r-help" class="hint">内側を転がる円の大きさ（r &lt; R）</p>
            </div>

            <div class="parameter">
              <div class="parameter-heading">
                <label for="d">ペンの位置 <span>d</span></label>
                <input id="d" name="d" type="number" min="0" max="300" step="1" value="100" required aria-describedby="d-help input-error">
              </div>
              <input id="d-range" data-parameter="d" type="range" min="0" max="300" step="1" value="100" aria-label="ペンの位置 d のスライダー">
              <p id="d-help" class="hint">回転円の中心からペンまでの距離</p>
            </div>

            <p id="input-error" class="error" role="status"></p>
            <button type="reset">初期値に戻す <span aria-hidden="true">↺</span></button>
          </form>
        </section>

        <figure class="drawing">
          <div id="canvas-container"></div>
          <p id="load-status" class="load-status" role="status">描画の準備中…</p>
          <noscript><p class="error">描画するには、ブラウザのJavaScriptを有効にしてください。</p></noscript>
          <figcaption><span id="curve-info"></span></figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
